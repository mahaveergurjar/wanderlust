<body>
  <style>
  .search-btn {
    background-color: #fe424d;
    color: #fff;
    border-radius: 25px;
    padding: 0 1rem;
  }

  .search-btn:hover {
    background-color: #fe424d;
    color: #fff;
  }

  .search-btn i {
    display: inline;
    margin-right: 0.5rem;
  }

  .search-input {
    border-radius: 25px;
    padding: 0.5rem 3rem;
    font-size: 0.8rem;
  }

  @media (max-width: 768px) {
    .navbar-collapse {
      background-color: #fff;
      padding: 1rem;
    }

    .navbar-nav {
      text-align: center;
      margin-top: 1rem;
    }

    .navbar-nav .nav-link {
      padding: 0.5rem 0;
      display: block;
      width: 100%;
    }

    .search-input {
      width: calc(100% - 3rem);
      margin-bottom: 0.5rem;
    }

    .search-btn {
      width: 100%;
      margin-top: 0.5rem;
    }

    form.d-flex {
      flex-direction: column;
      align-items: center;
    }
  }

  .highlight {
    background-color: yellow;
    color: black;
  }
</style>

<nav class="navbar navbar-expand-md bg-body-light border-bottom sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="/listings">
      <i class="fa-regular fa-compass"></i>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavAltMarkup"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <!-- Explore link -->
      <div class="navbar-nav">
        <a class="nav-link" href="/listings">Explore</a>
      </div>

      <!-- Search bar -->
      <div class="navbar-nav ms-auto">
        <form class="d-flex" role="search" onsubmit="searchText(event)">
          <input
            class="form-control me-2 search-input"
            type="search"

          />

          <button class="btn search-btn" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i> Search
          </button>
        </form>
      </div>

      <!-- Auth links -->
      <div class="navbar-nav ms-auto">
        
        <a class="nav-link" href="/signup"><b>Sign Up</b></a>

      </div>
    </div>
  </div>
</nav>

<script src="/js/search.js"></script>

    <div class="container">
       

<script src="/js/flash.js"></script>
 
<div class="row">
  <div class="col-8 offset-2">
    <br /><br />
    <h5>
      DEBUG currUser type: object, locals.currUser type: undefined
    </h5>
    <h3>Create New Listing</h3>
    <form
      method="post"
      action="/listings"
      novalidate
      class="needs-validation"
      enctype="multipart/form-data"
    >
      <div class="mb-3">
        <label for="username" class="form-label">Title</label>
        <input
          name="listing[title]"
          placeholder="Add a catchy title"
          type="text"
          class="form-control"
          required
        />
        <div class="valid-feedback">Title looks good!</div>
      </div>
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea
          name="listing[description]"
          placeholder="enter description"
          class="form-control"
          required
        ></textarea>
        <div class="invalid-feedback">Please enter a short description</div>
      </div>

      <div class="mb-3">
        <label for="image" class="form-label">Upload Listing Image</label>
        <input name="listing[image]" type="file" class="form-control" />
        required
      </div>
      <div class="row">
        <div class="mb-3 col-md-4">
          <label for="price" class="form-label">Price</label>
          <input
            name="listing[price]"
            placeholder="1200"
            class="form-control"
            required
          />
          <div class="invalid-feedback">Please enter a valid Price</div>
        </div>
        <div class="mb-3 col-md-8">
          <label for="country" class="form-label">Country</label>
          <input
            name="listing[country]"
            placeholder="India"
            type="text"
            class="form-control"
            required
          />
          <div class="invalid-feedback">Please enter the country name</div>
        </div>
      </div>
      <div class="mb-3">
        <label for="location" class="form-label">Location</label>
        <input
          name="listing[location]"
          placeholder="Jaipur, Rajsthan"
          type="text"
          class="form-control"
          required
        />
        <div class="invalid-feedback">Location should be valid</div>
      </div>
      <br /><br />
      <button class="btn btn-dark add-btn">Add</button>
      <br /><br />
    </form>
  </div>
</div>

    </div>
